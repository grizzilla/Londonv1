    #controls {
      background: #1e293b;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #search-box {
      flex: 1 1 180px;
      padding: 8px 12px;

      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    #category-select {

      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    
    /* Type Filter Checkboxes */
    .filter-type-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      font-size: 13px;
    }
    .filter-type-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    .filter-type-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { background: #1d4ed8; }

    /* Content Area */
    #main-content { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 330px;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 500;
    }
    #sidebar-header {
      padding: 12px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #sidebar-list { list-style: none; }
    .sidebar-item {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .sidebar-item:hover { background: #e2e8f0; }
    .sidebar-title { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
    .sidebar-sub { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .badge-container { display: flex; gap: 6px; align-items: center; }
    .sidebar-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      text-transform: uppercase;
    }
    .badge-requested { background-color: #475569; }
    .badge-suggested { background-color: #0284c7; }

    #map { flex: 1; width: 100%; height: 100%; }

    /* SVG Pin Styling */
    .custom-svg-pin { background: transparent; border: none; }

    /* Custom Popup Styles */
    .leaflet-popup-content-wrapper { border-radius: 8px; padding: 4px; max-width: 310px; }
    .popup-title-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .popup-title { font-weight: 700; font-size: 15px; color: #0f172a; }
    .popup-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .popup-row { font-size: 12px; color: #334155; margin-bottom: 4px; line-height: 1.4; }
    .popup-row strong { color: #0f172a; }
    .popup-link { margin-top: 8px; font-size: 12px; font-weight: 600; }
    .popup-link a { color: #2563eb; text-decoration: none; }


    /* Enriched Location Details */
    .sidebar-item { padding: 12px 14px; }
    .sidebar-detail {
      display: none;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #cbd5e1;
    }

      color: #334155;

  function getFormattedLoc(loc) {
    const d = detailDefaults[loc.cat] || detailDefaults["Casual Dining"];
    return {
      name: loc.name,
      cat: loc.cat,
      type: loc.type || "Requested",
      lat: loc.lat,
      lng: loc.lng,
      neighborhood: loc.neighborhood || "Central London",
      address: loc.address || `${loc.name}, London, UK`,
      tube: loc.tube || "Check nearest Tube station",
      setting: loc.setting || d.setting,
      reservations: loc.reservations || d.reservations,
      hours: loc.hours || d.hours,
      bestTime: loc.bestDaysTime || d.bestTime,
      worstTime: loc.worstDaysTime || d.worstTime,
      specialty: loc.specialty || d.specialty
    };
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

        <div class="popup-row"><strong>Tube:</strong> ${escapeHTML(loc.tube)}</div>
        <div class="popup-row"><strong>Setting:</strong> ${escapeHTML(loc.setting)}</div>
        <div class="popup-row"><strong>Reservations:</strong> ${escapeHTML(loc.reservations)}</div>

        <div class="popup-row"><strong>Worst Days/Time:</strong> ${escapeHTML(loc.worstTime)}</div>
        <div class="detail-specialty"><strong>Specialty / Feature / Main Attraction:</strong><br>${escapeHTML(loc.specialty)}</div>
      </div>`;

    rawLocations.forEach(raw => {
      const loc = getFormattedLoc(raw);
      const pinColor = (categoryColors[loc.cat] && categoryColors[loc.cat].color) || '#3b82f6';
      const customIcon = createPinIcon(pinColor);
      const m = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);

      const typeBadgeClass = loc.type === "Suggested" ? "badge-suggested" : "badge-requested";

      const popupHTML = `
        <div class="popup-title-container">
          <div class="popup-title">${escapeHTML(loc.name)}</div>
          <span class="sidebar-badge ${typeBadgeClass}">${escapeHTML(loc.type)}</span>
        </div>
        <div class="popup-cat" style="color:${pinColor}">
          ${escapeHTML(loc.cat)} • ${escapeHTML(loc.neighborhood)}
        </div>
        ${buildDetailsHTML(loc)}
        <div class="popup-link">
          <a href="https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}" target="_blank" rel="noopener">
            🗺️ Open Directions in Google Maps
          </a>
        </div>
      `;

      m.bindPopup(popupHTML, { maxWidth: 340 });
      markerStore.push({ marker: m, data: loc, color: pinColor });
    });

    updateSidebar(markerStore);
  }

  function updateSidebar(visibleItems) {
    const listEl = document.getElementById('sidebar-list');
    const countEl = document.getElementById('location-count');
    listEl.innerHTML = '';
    countEl.textContent = visibleItems.length;

    visibleItems.forEach(item => {
      const li = document.createElement('li');
      li.className = 'sidebar-item';

      const typeBadgeClass = item.data.type === "Suggested" ? "badge-suggested" : "badge-requested";

      li.innerHTML = `
        <div class="sidebar-title">${escapeHTML(item.data.name)}</div>
        <div class="sidebar-sub">📍 ${escapeHTML(item.data.neighborhood)} | 🚇 ${escapeHTML(item.data.tube)}</div>
        <div class="badge-container">
          <span class="sidebar-badge" style="background-color:${item.color}">${escapeHTML(item.data.cat)}</span>
          <span class="sidebar-badge ${typeBadgeClass}">${escapeHTML(item.data.type)}</span>
        </div>
        <div class="sidebar-detail">
          <div class="detail-row"><strong>Setting:</strong> ${escapeHTML(item.data.setting)}</div>
          <div class="detail-row"><strong>Reservations:</strong> ${escapeHTML(item.data.reservations)}</div>
          <div class="detail-row"><strong>Hours:</strong> ${escapeHTML(item.data.hours)}</div>
          <div class="detail-row"><strong>Best:</strong> ${escapeHTML(item.data.bestTime)}</div>
          <div class="detail-row"><strong>Worst:</strong> ${escapeHTML(item.data.worstTime)}</div>
          <div class="detail-specialty"><strong>Specialty / Feature:</strong><br>${escapeHTML(item.data.specialty)}</div>
        </div>
      `;

      li.onclick = () => {
        document.querySelectorAll('.sidebar-item.expanded').forEach(el => {
          if (el !== li) el.classList.remove('expanded');
        });
        li.classList.toggle('expanded');
        map.setView([item.data.lat, item.data.lng], 16);
        item.marker.openPopup();
      };

      listEl.appendChild(li);
    });
  }

  function filterMarkers() {
    const searchVal = document.getElementById('search-box').value.trim().toLowerCase();
    const catVal = document.getElementById('category-select').value;
    const showRequested = document.getElementById('chk-requested').checked;
    const showSuggested = document.getElementById('chk-suggested').checked;

    const visibleItems = [];

    markerStore.forEach(item => {
      const d = item.data;
      const searchable = [
        d.name, d.cat, d.type, d.neighborhood, d.tube, d.address,
        d.setting, d.reservations, d.hours, d.bestTime, d.worstTime, d.specialty
      ].join(" ").toLowerCase();

      const matchesSearch = !searchVal || searchable.includes(searchVal);
      const matchesCat = catVal === 'ALL' || d.cat === catVal;
      const matchesType =
        (d.type === 'Requested' && showRequested) ||
        (d.type === 'Suggested' && showSuggested);

      if (matchesSearch && matchesCat && matchesType) {
        if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
        visibleItems.push(item);
      } else if (map.hasLayer(item.marker)) {
        map.removeLayer(item.marker);
      }
    });

    updateSidebar(visibleItems);
  }

  function resetFilters() {
    document.getElementById('search-box').value = '';
    document.getElementById('category-select').value = 'ALL';
    document.getElementById('chk-requested').checked = true;
    document.getElementById('chk-suggested').checked = true;
    filterMarkers();

    if (userMarker) {
      map.removeLayer(userMarker);
      userMarker = null;
    }

    map.setView([51.5074, -0.1278], 13);
  }

  function locateUser() {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const uLat = pos.coords.latitude;
        const uLng = pos.coords.longitude;

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.circleMarker([uLat, uLng], {
          radius: 9,
          fillColor: '#2563eb',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>You Are Here</b>").openPopup();

        let closest = null;
        let minDistance = Infinity;

        markerStore.forEach(item => {
          if (map.hasLayer(item.marker)) {
            const loc = item.data;
            const dist = map.distance([uLat, uLng], [loc.lat, loc.lng]);
            if (dist < minDistance) {
              minDistance = dist;
              closest = loc;
            }
          }
        });

        if (closest) {
          map.setView([uLat, uLng], 15);
          alert(`Nearest visible spot is "${closest.name}" (${Math.round(minDistance)} meters away).`);
        } else {
          map.setView([uLat, uLng], 14);
        }
      },
      () => alert("Unable to retrieve your current location. Please check GPS permissions.")
    );
  }

  loadMarkers();
</script>
</body>
</html>
